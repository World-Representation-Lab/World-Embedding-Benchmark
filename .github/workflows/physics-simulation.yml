name: Physics simulation

on:
  push:
    paths:
      - 'physics_simulation/**'
      - '.github/workflows/physics-simulation.yml'
  pull_request:
    paths:
      - 'physics_simulation/**'
      - '.github/workflows/physics-simulation.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: physics_simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install . pytest numpy
      - name: Run tests
        run: pytest -q
      - name: List simulation examples
        run: python run_simulation.py list
      - name: Check installed command
        working-directory: ${{ runner.temp }}
        run: web-sim list
